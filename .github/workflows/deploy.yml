name: Deploy to GitHub Pages

# Builds the site from main's code and the public research records in Yarong-i/yarong-research-data:
#   1. check out main (code) and the data repository (records, already merged there by its own workflow);
#   2. astro check + build + dist guard (npm run build);
#   3. deploy Pages only after a successful build.
# A failed run deploys nothing, so the current public site stays as it is; re-running the workflow retries.
# Every deploy - code change, schedule or manual - uses the latest records, so they never go back.
# This workflow writes to no repository.
#
# Normal path: the research server publishes within a minute of a finalized recommendation (08:25-08:59 KST,
# 15:35-16:18 KST), the data repository merges and then starts this workflow (workflow_dispatch).
# The schedule below is only a retry for a missed or failed dispatch. Every run builds from the LATEST records,
# so a late or repeated run never deploys older data. (GitHub may start scheduled runs some minutes late.)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '45,55 23 * * 0-4'  # 08:45 / 08:55 KST, Mon-Fri
    - cron: '10 0 * * 1-5'    # 09:10 KST
    - cron: '30 0 * * 1-5'    # 09:30 KST
    - cron: '15 7 * * 1-5'    # 16:15 KST
    - cron: '30 7 * * 1-5'    # 16:30 KST

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (code)
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Check out the research records
        uses: actions/checkout@v7
        with:
          repository: Yarong-i/yarong-research-data
          ref: main
          path: _data
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use the published records
        run: |
          mkdir -p src/content/research src/content/performance
          cp _data/src/content/research/*.json src/content/research/ 2>/dev/null || true
          cp _data/src/content/performance/*.json src/content/performance/ 2>/dev/null || true
          echo "records: $(ls src/content/research/*.json 2>/dev/null | wc -l) days, data commit $(git -C _data rev-parse --short HEAD)"
          # Last durable live-trading snapshot (the page polls the live endpoint for anything newer).
          if [ -f _data/live/live-trading.json ]; then mkdir -p data && cp _data/live/live-trading.json data/live-trading.json; fi
          # Per-date archives, served at /live/days/<date>.json for event links when the live bucket cannot be read.
          if [ -d _data/live/days ]; then mkdir -p public/live/days && cp _data/live/days/*.json public/live/days/ 2>/dev/null || true; fi
          # The public list of operating days, for /live/ when the bucket cannot be read.
          if [ -f _data/live/index.json ]; then mkdir -p public/live && cp _data/live/index.json public/live/index.json; fi
      - name: Check and build
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
